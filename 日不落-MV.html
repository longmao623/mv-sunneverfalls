<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日不落 · 致敬视觉MV</title>
<style>
  html,body{margin:0;height:100%;background:radial-gradient(1200px 700px at 50% 30%, #0b1030, #04050e);overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #frame{position:relative}
  canvas{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 20px 80px rgba(0,0,0,.65)}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;border-radius:10px;background:radial-gradient(600px 400px at 50% 45%, rgba(8,12,40,.22), rgba(3,4,12,.72))}
  #playBtn{width:96px;height:96px;border-radius:50%;background:rgba(255,200,90,.14);border:2px solid rgba(255,210,120,.75);color:#ffd27a;font-size:36px;display:flex;align-items:center;justify-content:center;font-family:serif;text-shadow:0 0 18px rgba(255,180,80,.85);transition:transform .15s;padding-left:6px}
  #overlay:hover #playBtn{transform:scale(1.07)}
  #hint{color:rgba(255,240,220,.78);font-size:15px;letter-spacing:2px;font-family:"KaiTi","STKaiti",serif;text-align:center;line-height:1.9}
  #btns{position:absolute;right:14px;bottom:14px;display:none;gap:10px}
  #btns button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,220,170,.5);background:rgba(20,20,40,.6);color:#ffe9c4;font-size:17px;cursor:pointer;backdrop-filter:blur(2px)}
  #btns button:hover{background:rgba(70,55,110,.75)}
</style>
</head>
<body>
<div id="wrap">
  <div id="frame">
    <canvas id="cv"></canvas>
    <div id="overlay">
      <div id="playBtn">&#9654;</div>
      <div id="hint">《日不落》致敬视觉MV<br>点击播放 · 歌词与旋律逐拍对齐 · 空格暂停 / R 重播</div>
    </div>
    <div id="btns"><button id="bPlay" title="播放/暂停">&#10074;&#10074;</button><button id="bRe" title="重新播放">&#8635;</button></div>
  </div>
</div>
<script>
'use strict';
/* ============================================================
   日不落 · 致敬视觉MV（单文件）
   - 音乐：Web Audio 实时合成，原创致敬编曲（125 BPM）
   - 歌词：原创致敬词，7字/句，一字一拍，与旋律逐拍对齐
   - 画面：Canvas 2D，黎明→白昼→黄昏→夜幕太阳不落
   ============================================================ */

/* ---------- 基本时间 ---------- */
const W = 1280, H = 720, HOR = Math.round(H * 0.72);
const BPM = 125, BEAT = 60 / BPM, BAR = BEAT * 4;   // 拍=0.48s 小节=1.92s
const TOTAL_BARS = 52, DUR = TOTAL_BARS * BAR;      // 99.84s

/* ---------- 曲式结构 ---------- */
const SEC_DEF = [
  ['intro',    0,  4], ['verse1',  4, 12], ['pre1',   12, 16],
  ['chorus1', 16, 24], ['interlude',24, 28], ['verse2',28, 36],
  ['pre2',   36, 40], ['chorus2', 40, 48], ['outro',  48, 52]
];
const SECS = SEC_DEF.map(function (s) { return { name: s[0], t0: s[1] * BAR, t1: s[2] * BAR }; });
const SEC_CN = { intro:'前奏', verse1:'主歌 A', pre1:'导唱', chorus1:'副歌', interlude:'间奏',
                 verse2:'主歌 B', pre2:'导唱', chorus2:'副歌', outro:'尾奏' };

/* ---------- 和声（C 大调流行进行） ---------- */
const PROG = {
  intro:    ['F','G','Am','Em'],
  verse1:   ['Am','F','C','G','Am','F','C','G'],
  pre1:     ['Dm','Em','F','G'],
  chorus1:  ['C','G','Am','F','C','G','F','G'],
  interlude:['Am','F','C','G'],
  verse2:   ['Am','F','C','G','Am','F','C','G'],
  pre2:     ['Dm','Em','F','G'],
  chorus2:  ['C','G','Am','F','C','G','F','G'],
  outro:    ['F','G','C','C']
};
const CHORDS = {
  C : { bass:36, pad:[60,64,67], arp:[60,64,67,72] },
  G : { bass:31, pad:[55,59,62], arp:[55,59,62,67] },
  Am: { bass:33, pad:[57,60,64], arp:[57,60,64,69] },
  F : { bass:29, pad:[57,60,65], arp:[57,60,65,69] },
  Em: { bass:28, pad:[55,59,64], arp:[55,59,64,67] },
  Dm: { bass:26, pad:[57,62,65], arp:[57,62,65,69] }
};
function secOfBar (bar) {
  var bt = bar * BAR;
  for (var i = 0; i < SECS.length; i++) { var s = SECS[i]; if (bt >= s.t0 - 1e-9 && bt < s.t1 - 1e-9) return s.name; }
  return 'outro';
}
function chordAtBar (bar) {
  var name = secOfBar(bar);
  var s = SECS.filter(function (x) { return x.name === name; })[0];
  var local = Math.round((bar * BAR - s.t0) / BAR);
  var arr = PROG[name];
  return arr[local % arr.length];
}

/* ---------- 歌词（原创致敬词 · 每句7字 · 一字一拍） ---------- */
var L = function (bar) { return { t: bar * BAR, span: 2 * BAR, text: '' }; };
var LINES = [
  /* 主歌 A：bars 4,6,8,10 */
  Object.assign(L(4),  { text:'天空刚刚亮起来' }),
  Object.assign(L(6),  { text:'你的笑容比云彩' }),
  Object.assign(L(8),  { text:'一路追着光跑向海' }),
  Object.assign(L(10), { text:'心跳快得好精彩' }),
  /* 导唱：bars 12,14 */
  Object.assign(L(12), { text:'如果时间会更改' }),
  Object.assign(L(14), { text:'我也不会把手放开' }),
  /* 副歌：bars 16,18,20,22 */
  Object.assign(L(16), { text:'你是我的日不落' }),
  Object.assign(L(18), { text:'挂在心口最亮的角落' }),
  Object.assign(L(20), { text:'就算夜里星星沉默' }),
  Object.assign(L(22), { text:'你的温度还在闪烁' }),
  /* 主歌 B：bars 28,30,32,34 */
  Object.assign(L(28), { text:'城市灯火慢慢熄灭' }),
  Object.assign(L(30), { text:'只有你还那么强烈' }),
  Object.assign(L(32), { text:'穿过人海每一个黑夜' }),
  Object.assign(L(34), { text:'你都在我头顶不歇' }),
  /* 导唱2：bars 36,38 */
  Object.assign(L(36), { text:'季节变换着色彩' }),
  Object.assign(L(38), { text:'而你始终没有离开' }),
  /* 副歌2：bars 40,42,44,46 */
  Object.assign(L(40), { text:'你是我的日不落' }),
  Object.assign(L(42), { text:'挂在心口最亮的角落' }),
  Object.assign(L(44), { text:'就算世界偶尔降温' }),
  Object.assign(L(46), { text:'你还亮着从不落幕' })
];

/* ---------- 旋律骨架（和弦音池 + 每段音型，8拍/句） ---------- */
var MELODY_PAT = {
  verse1:[0,1,2,1,2,1,2,3], verse2:[0,1,2,1,2,1,2,3],
  pre1:[0,1,2,3,0,1,2,3],    pre2:[0,1,2,3,0,1,2,3],
  chorus1:[3,2,1,2,3,2,1,2], chorus2:[3,2,1,2,3,2,1,2]
};
function poolOf (ch) { var p = CHORDS[ch].pad; return [p[0]+12, p[1]+12, p[2]+12, p[0]+24]; }

/* ---------- 视觉关键帧（天空色 / 太阳高度 / 星空 / 城市） ---------- */
var VK = [
  { t:0.00,  top:'#060d26', mid:'#12204f', bot:'#31255c', sunY:1.30,  rays:0.00, stars:1.00, city:0.00, cloud:0.25, seaGlow:0.12 },
  { t:7.68,  top:'#122a63', mid:'#5a4a92', bot:'#e08a5e', sunY:1.045, rays:0.10, stars:0.30, city:0.00, cloud:0.45, seaGlow:0.30 },
  { t:23.04, top:'#2560b2', mid:'#79a8e0', bot:'#ffd28a', sunY:0.80,  rays:0.35, stars:0.00, city:0.00, cloud:0.70, seaGlow:0.50 },
  { t:30.72, top:'#3a86e0', mid:'#a8d4f5', bot:'#fff3c4', sunY:0.40,  rays:1.00, stars:0.00, city:0.00, cloud:1.00, seaGlow:0.80 },
  { t:46.08, top:'#2a6fd6', mid:'#8ec2f0', bot:'#ffe9b0', sunY:0.26,  rays:0.45, stars:0.00, city:0.00, cloud:1.10, seaGlow:0.60 },
  { t:53.76, top:'#4a4a8e', mid:'#c96a8e', bot:'#ffb46b', sunY:0.62,  rays:0.25, stars:0.15, city:0.65, cloud:0.85, seaGlow:0.50 },
  { t:69.12, top:'#2b2b6e', mid:'#a2498a', bot:'#ff8a5c', sunY:0.94,  rays:0.20, stars:0.25, city:0.90, cloud:0.65, seaGlow:0.60 },
  { t:76.80, top:'#0e1a4a', mid:'#3b2f7a', bot:'#e2653f', sunY:0.985, rays:0.75, stars:0.55, city:1.00, cloud:0.45, seaGlow:0.70 },
  { t:92.16, top:'#0a1234', mid:'#1c2a5e', bot:'#8a3a55', sunY:0.97,  rays:0.85, stars:0.95, city:0.85, cloud:0.35, seaGlow:0.50 },
  { t:99.84, top:'#0a1234', mid:'#1c2a5e', bot:'#8a3a55', sunY:0.97,  rays:0.85, stars:0.95, city:0.85, cloud:0.35, seaGlow:0.50 }
];

/* ---------- 工具 ---------- */
var RGBCACHE = {};
function rgbOf (h) {
  if (!RGBCACHE[h]) RGBCACHE[h] = [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  return RGBCACHE[h];
}
function mixHex (h1, h2, u) {
  var a = rgbOf(h1), b = rgbOf(h2);
  return 'rgb(' + Math.round(a[0]+(b[0]-a[0])*u) + ',' + Math.round(a[1]+(b[1]-a[1])*u) + ',' + Math.round(a[2]+(b[2]-a[2])*u) + ')';
}
function smooth (u) { u = Math.max(0, Math.min(1, u)); return u*u*(3-2*u); }
function fmt (s) {
  s = Math.max(0, Math.min(DUR, s));
  var m = Math.floor(s/60), r = Math.floor(s%60);
  return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;
}
function secName (t) {
  for (var i=0;i<SECS.length;i++){ if (t>=SECS[i].t0 && t<SECS[i].t1) return SECS[i].name; }
  return 'outro';
}
function getVis (t) {
  var k = 0;
  while (k < VK.length-2 && t > VK[k+1].t) k++;
  var a = VK[k], b = VK[k+1];
  var u = smooth((t - a.t) / Math.max(0.0001, b.t - a.t));
  return {
    top: mixHex(a.top,b.top,u), mid: mixHex(a.mid,b.mid,u), bot: mixHex(a.bot,b.bot,u),
    sunY: a.sunY+(b.sunY-a.sunY)*u, rays: a.rays+(b.rays-a.rays)*u, stars: a.stars+(b.stars-a.stars)*u,
    city: a.city+(b.city-a.city)*u, cloud: a.cloud+(b.cloud-a.cloud)*u, seaGlow: a.seaGlow+(b.seaGlow-a.seaGlow)*u
  };
}

/* ============================================================
   音频引擎
   ============================================================ */
var AC = null, master = null, noiseBuf = null;
function initAudio () {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  var comp = AC.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.22;
  master = AC.createGain(); master.gain.value = 0.9;
  master.connect(comp); comp.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  var d = noiseBuf.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
}
function F (m) { return 440 * Math.pow(2, (m-69)/12); }
function noiseSrc (t, dur) {
  var s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  s.start(t); s.stop(t + dur); return s;
}
function kick (t, g) {
  var o = AC.createOscillator(), ga = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  ga.gain.setValueAtTime(0.8*g, t);
  ga.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
  o.connect(ga); ga.connect(master); o.start(t); o.stop(t + 0.3);
}
function hat (t, g, open) {
  var s = noiseSrc(t, open ? 0.6 : 0.12);
  var f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7500;
  var ga = AC.createGain();
  ga.gain.setValueAtTime((open ? 0.14 : 0.09) * g, t);
  ga.gain.exponentialRampToValueAtTime(0.001, t + (open ? 0.45 : 0.05));
  s.connect(f); f.connect(ga); ga.connect(master);
}
function snare (t, g) {
  var s = noiseSrc(t, 0.25);
  var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 0.8;
  var ga = AC.createGain();
  ga.gain.setValueAtTime(0.32*g, t);
  ga.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  s.connect(f); f.connect(ga); ga.connect(master);
  var o = AC.createOscillator(), g2 = AC.createGain();
  o.type = 'triangle'; o.frequency.value = 190;
  g2.gain.setValueAtTime(0.18*g, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  o.connect(g2); g2.connect(master); o.start(t); o.stop(t + 0.1);
}
function bassN (t, m, dur, g) {
  var o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = F(m);
  var f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 520;
  var ga = AC.createGain();
  ga.gain.setValueAtTime(0, t);
  ga.gain.linearRampToValueAtTime(g, t + 0.015);
  ga.gain.setValueAtTime(g, t + dur*0.7);
  ga.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(f); f.connect(ga); ga.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
function padC (t, midis, dur, g) {
  var f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
  var ga = AC.createGain();
  ga.gain.setValueAtTime(0, t);
  ga.gain.linearRampToValueAtTime(g, t + 0.3);
  ga.gain.setValueAtTime(g, t + dur*0.6);
  ga.gain.linearRampToValueAtTime(0.0001, t + dur);
  f.connect(ga); ga.connect(master);
  for (var i = 0; i < midis.length; i++) {
    for (var d = -7; d <= 7; d += 14) {
      var o = AC.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = F(midis[i]); o.detune.value = d;
      o.connect(f); o.start(t); o.stop(t + dur + 0.05);
    }
  }
}
function arpN (t, m, g) {
  var o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = F(m);
  var ga = AC.createGain();
  ga.gain.setValueAtTime(0, t);
  ga.gain.linearRampToValueAtTime(g, t + 0.008);
  ga.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
  o.connect(ga); ga.connect(master); o.start(t); o.stop(t + 0.3);
}
function leadN (t, m, dur, g) {
  var o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = F(m);
  var vib = AC.createOscillator(); vib.frequency.value = 5.2;
  var vg = AC.createGain();
  vg.gain.setValueAtTime(0, t);
  vg.gain.linearRampToValueAtTime(6, t + 0.25);
  vib.connect(vg); vg.connect(o.detune);
  var ga = AC.createGain();
  ga.gain.setValueAtTime(0, t);
  ga.gain.linearRampToValueAtTime(g, t + 0.04);
  ga.gain.setValueAtTime(g*0.9, t + dur*0.75);
  ga.gain.linearRampToValueAtTime(0.0001, t + dur + 0.08);
  o.connect(ga); ga.connect(master);
  o.start(t); o.stop(t + dur + 0.15);
  vib.start(t); vib.stop(t + dur + 0.15);
}

/* ---------- 各段鼓组/贝斯配置 ---------- */
var PADG = { intro:0.10, verse1:0.10, pre1:0.12, chorus1:0.14, interlude:0.11,
             verse2:0.10, pre2:0.12, chorus2:0.13, outro:0.10 };
var DRUM = {
  intro:    { kick:[],     hat8:false, clap:[],     bass:null },
  verse1:   { kick:[0,2],  hat8:true,  clap:[],     bass:'q' },
  pre1:     { kick:[0,2],  hat8:true,  clap:[1,3],  bass:'q', roll:true },
  chorus1:  { kick:[0,1,2,3], hat8:true, clap:[1,3], bass:'o', crash:true },
  interlude:{ kick:[0,2],  hat8:true,  clap:[],     bass:'q' },
  verse2:   { kick:[0,2],  hat8:true,  clap:[],     bass:'q' },
  pre2:     { kick:[0,2],  hat8:true,  clap:[1,3],  bass:'q', roll:true },
  chorus2:  { kick:[0,1,2,3], hat8:true, clap:[1,3], bass:'o', crash:true },
  outro:    { kick:[],     hat8:false, clap:[],     bass:'w' }
};

/* ---------- 总谱构建：所有音符事件按绝对时间预排 ---------- */
function buildScore (t0) {
  var ev = [];
  function add (rel, fn) { ev.push({ t: t0 + rel, fn: fn }); }

  for (var bar = 0; bar < TOTAL_BARS; bar++) {
    var bt = bar * BAR;
    var sec = secOfBar(bar);
    var ch = chordAtBar(bar);
    var C = CHORDS[ch];
    var f = DRUM[sec];

    /* 和声铺底 */
    add(bt, (function (cc) { return function (t) { padC(t, cc.pad, BAR + 0.12, PADG[sec]); }; })(C));

    /* 鼓 */
    (function (ff) {
      ff.kick.forEach(function (b) { add(bt + b*BEAT, function (t) { kick(t, 1); }); });
      if (ff.hat8) { for (var b = 0; b < 4; b++) add(bt + (b+0.5)*BEAT, function (t) { hat(t, 1, false); }); }
      ff.clap.forEach(function (b) { add(bt + b*BEAT, function (t) { snare(t, 0.9); }); });
      if (ff.crash && (bar === 16 || bar === 40)) add(bt, function (t) { hat(t, 2.2, true); });
      if (ff.crash) { add(bt + 0.5*BEAT, function (t) { hat(t, 1.1, true); }); add(bt + 2.5*BEAT, function (t) { hat(t, 1.1, true); }); }
    })(f);

    /* 导唱末小节军鼓滚奏 */
    if (bar === 15 || bar === 39) {
      for (var r = 0; r < 16; r++) {
        (function (rr, gg) { add(bt + rr*BEAT/4, function (t) { snare(t, gg); }); })(r, 0.2 + 0.75*(r/15));
      }
    }

    /* 贝斯 */
    if (f.bass === 'q') { for (var q = 0; q < 4; q++) (function (m) { add(bt + q*BEAT, function (t) { bassN(t, m, BEAT*0.7, 0.22); }); })(C.bass); }
    else if (f.bass === 'o') {
      for (var ob = 0; ob < 4; ob++) {
        (function (m1, m2) {
          add(bt + ob*BEAT,       function (t) { bassN(t, m1, BEAT*0.42, 0.2); });
          add(bt + (ob+0.5)*BEAT, function (t) { bassN(t, m2, BEAT*0.42, 0.16); });
        })(C.bass, C.bass + 12);
      }
    } else if (f.bass === 'w') { (function (m) { add(bt, function (t) { bassN(t, m, BAR*0.95, 0.18); }); })(C.bass); }

    /* 琶音 */
    if (sec === 'intro' || sec === 'interlude' || sec === 'outro') {
      for (var a = 0; a < 16; a++) (function (m) { add(bt + a*BEAT/4, function (t) { arpN(t, m, 0.055); }); })(C.arp[a % 4]);
    } else {
      var ag = (sec === 'chorus1' || sec === 'chorus2') ? 0.06 : 0.045;
      for (var e = 0; e < 8; e++) (function (m) { add(bt + e*BEAT/2, function (t) { arpN(t, m, ag); }); })(C.arp[e % 4]);
    }
  }

  /* 主旋律：每句歌词 8 拍，一字一拍，末拍延音 */
  for (var li = 0; li < LINES.length; li++) {
    var line = LINES[li];
    var lsec = secName(line.t);
    var pat = MELODY_PAT[lsec];
    if (!pat) continue;
    var lineBar = Math.round(line.t / BAR);
    var lg = (lsec === 'chorus1' || lsec === 'chorus2') ? 0.15 : 0.115;
    for (var b2 = 0; b2 < 8; b2++) {
      (function (bb, chName, midi, dur, gain) {
        add(line.t + bb*BEAT, function (t) { leadN(t, midi, dur, gain); });
      })(b2, ch, poolOf(chordAtBar(lineBar + (b2 >= 4 ? 1 : 0)))[pat[b2]], (b2 === 7 ? 1.7 : 0.92)*BEAT, lg);
    }
  }

  ev.sort(function (a, b) { return a.t - b.t; });
  return ev;
}

/* ---------- 播放控制 ---------- */
var started = false, playing = false, ended = false;
var t0 = 0, evIdx = 0, events = [], timerId = null;

function startPlayback () {
  initAudio();
  AC.resume();
  t0 = AC.currentTime + 0.2;
  events = buildScore(t0);
  evIdx = 0; ended = false;
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setValueAtTime(0.9, AC.currentTime);
  master.gain.setValueAtTime(0.9, t0 + 96.5);
  master.gain.linearRampToValueAtTime(0.0001, t0 + 99.7);
  timerId = setInterval(function () {
    if (!AC) return;
    var now = AC.currentTime, hor = now + 0.45;
    while (evIdx < events.length && events[evIdx].t < hor) {
      if (events[evIdx].t >= now - 0.02) {
        try { events[evIdx].fn(events[evIdx].t); } catch (e) {}
      }
      evIdx++;
    }
  }, 40);
  started = true; playing = true;
  updateUI();
}
function togglePlay () {
  if (ended) { restart(); return; }
  if (!started) { startPlayback(); return; }
  if (playing) { AC.suspend(); playing = false; }
  else { AC.resume(); playing = true; }
  updateUI();
}
function restart () {
  if (timerId) { clearInterval(timerId); timerId = null; }
  if (AC) { try { AC.close(); } catch (e) {} }
  AC = null; master = null;
  started = false; playing = false; ended = false;
  particles.length = 0; lastBeatIdx = -1;
  startPlayback();
}
function songT () {
  if (!started || !AC) return 0;
  return AC.currentTime - t0;
}

/* ============================================================
   视觉渲染
   ============================================================ */
var cv = document.getElementById('cv');
var cx = cv.getContext('2d');
var frame = document.getElementById('frame');
var overlay = document.getElementById('overlay');
var btns = document.getElementById('btns');
var bPlay = document.getElementById('bPlay');

function fit () {
  var availW = window.innerWidth - 24, availH = window.innerHeight - 24;
  var ar = W / H, w = availW, h = w / ar;
  if (h > availH) { h = availH; w = h * ar; }
  frame.style.width = w + 'px'; frame.style.height = h + 'px';
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', fit);
fit();

/* ---------- 场景元素预生成 ---------- */
var stars = [];
for (var si = 0; si < 150; si++) stars.push({ x: Math.random()*W, y: Math.random()*HOR*0.95, r: 0.5+Math.random()*1.3, ph: Math.random()*6.28, sp: 0.5+Math.random()*1.5 });

function makeClouds (n, y0, y1, s0, s1, sp0, sp1) {
  var arr = [];
  for (var ci = 0; ci < n; ci++) {
    var puffs = [];
    var np = 5 + Math.floor(Math.random()*4);
    for (var pi = 0; pi < np; pi++) puffs.push({ dx: (Math.random()-0.5)*150, dy: (Math.random()-0.5)*36, rx: 40+Math.random()*55, ry: 16+Math.random()*18 });
    arr.push({ x: Math.random()*(W+400), y: y0+Math.random()*(y1-y0), sc: s0+Math.random()*(s1-s0), sp: sp0+Math.random()*(sp1-sp0), puffs: puffs });
  }
  return arr;
}
var cloudsBack  = makeClouds(6, H*0.20, H*0.42, 0.7, 1.2, 8, 16);
var cloudsFront = makeClouds(5, H*0.50, H*0.64, 1.2, 2.0, 20, 36);

var buildings = [];
(function () {
  var x = -20;
  while (x < W + 40) {
    var bw = 36 + Math.random()*70, bh = 50 + Math.random()*190;
    var win = [];
    for (var wy = 10; wy < bh - 8; wy += 16)
      for (var wx = 8; wx < bw - 8; wx += 14)
        if (Math.random() < 0.45) win.push({ dx: wx, dy: wy, ph: Math.random()*6.28 });
    buildings.push({ x: x, w: bw, h: bh, win: win });
    x += bw + 4 + Math.random()*10;
  }
})();

var seaLines = [];
for (var sl = 0; sl < 26; sl++) seaLines.push({ y: HOR + 8 + Math.random()*(H - HOR - 20), x0: Math.random()*W, w: 60+Math.random()*160, ph: Math.random()*6.28, sp: 6+Math.random()*22 });

var particles = [];
function spawnParticles (n) {
  for (var i = 0; i < n; i++) {
    if (particles.length > 260) break;
    particles.push({
      x: Math.random()*W, y: HOR*0.55 + Math.random()*HOR*0.5,
      vx: (Math.random()-0.5)*14, vy: -18 - Math.random()*42,
      life: 1, dec: 0.30 + Math.random()*0.35, r: 0.8 + Math.random()*2.2
    });
  }
}
var lastBeatIdx = -1;

/* ---------- 绘制 ---------- */
var KAI = '"KaiTi","STKaiti","DFKai-SB","TW-Kai","Noto Serif SC",serif';
var TOPBAR = 54, BOTBAR = 86;

function drawSky (v) {
  var g = cx.createLinearGradient(0, 0, 0, HOR + 4);
  g.addColorStop(0, v.top); g.addColorStop(0.55, v.mid); g.addColorStop(1, v.bot);
  cx.fillStyle = g;
  cx.fillRect(0, 0, W, HOR + 4);
}
function drawStars (v, t) {
  if (v.stars < 0.01) return;
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    var a = v.stars * (0.35 + 0.55 * (0.5 + 0.5*Math.sin(t*s.sp + s.ph)));
    if (a <= 0.02) continue;
    cx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
    cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.283); cx.fill();
  }
}
function drawSun (v, t, pulse) {
  var sx = W*0.5, sy = v.sunY * HOR;
  var rays = v.rays;
  /* 光晕 */
  var gr = (170 + 90*pulse) * Math.max(rays, 0.28);
  var g = cx.createRadialGradient(sx, sy, 0, sx, sy, gr);
  g.addColorStop(0, 'rgba(255,226,160,' + (0.20 + 0.42*rays).toFixed(3) + ')');
  g.addColorStop(0.5, 'rgba(255,180,90,' + (0.08 + 0.20*rays).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(255,160,60,0)');
  cx.fillStyle = g;
  cx.fillRect(sx-gr, sy-gr, gr*2, gr*2);
  /* 光芒 */
  if (rays > 0.02) {
    cx.save(); cx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 14; i++) {
      var a = t*0.12 + i * 6.283/14;
      var r2 = 100 + 70*Math.sin(t*0.7 + i*1.7) + 40*pulse;
      var al = rays * (i%2 ? 0.05 : 0.10);
      cx.fillStyle = 'rgba(255,205,120,' + al.toFixed(3) + ')';
      cx.beginPath();
      cx.moveTo(sx + Math.cos(a)*54, sy + Math.sin(a)*54);
      cx.lineTo(sx + Math.cos(a+0.05)*r2, sy + Math.sin(a+0.05)*r2);
      cx.lineTo(sx + Math.cos(a-0.05)*r2, sy + Math.sin(a-0.05)*r2);
      cx.closePath(); cx.fill();
    }
    cx.restore();
  }
  /* 日轮 */
  var r = 44 * (1 + 0.05*pulse);
  if (sy - r < HOR + 6) {
    var dg = cx.createRadialGradient(sx, sy, 0, sx, sy, r);
    dg.addColorStop(0, '#fffbe8'); dg.addColorStop(0.55, '#ffd76a'); dg.addColorStop(1, '#ff9c3c');
    cx.fillStyle = dg;
    cx.beginPath(); cx.arc(sx, sy, r, 0, 6.283); cx.fill();
  }
  return { sx: sx, sy: sy };
}
function drawSea (v, t, sun) {
  var g = cx.createLinearGradient(0, HOR, 0, H);
  g.addColorStop(0, mixHex('#1a2f55', '#02030a', 0.35));
  g.addColorStop(0.15, '#0a1526');
  g.addColorStop(1, '#010208');
  cx.fillStyle = g;
  cx.fillRect(0, HOR, W, H - HOR);
  /* 海平线暖光 */
  if (v.seaGlow > 0.02) {
    var rg = cx.createRadialGradient(sun.sx, HOR, 0, sun.sx, HOR, 320*v.seaGlow + 80);
    rg.addColorStop(0, 'rgba(255,185,105,' + (0.40*v.seaGlow).toFixed(3) + ')');
    rg.addColorStop(1, 'rgba(255,150,60,0)');
    cx.save();
    cx.beginPath(); cx.rect(0, HOR, W, H-HOR); cx.clip();
    cx.fillStyle = rg;
    cx.beginPath(); cx.ellipse(sun.sx, HOR + 8, 320*v.seaGlow + 80, 90*v.seaGlow + 24, 0, 0, 6.283); cx.fill();
    cx.restore();
  }
  /* 波光 */
  cx.lineWidth = 1.4;
  for (var i = 0; i < seaLines.length; i++) {
    var s = seaLines[i];
    var xx = (s.x0 + t*s.sp) % (W + 240) - 120;
    var a = 0.05 + 0.05 * (0.5 + 0.5*Math.sin(t*2 + s.ph));
    cx.strokeStyle = 'rgba(255,215,165,' + a.toFixed(3) + ')';
    cx.beginPath(); cx.moveTo(xx, s.y + Math.sin(t + s.ph)*2); cx.lineTo(xx + s.w, s.y + Math.sin(t*1.3 + s.ph)*2); cx.stroke();
  }
}
function drawCloudLayer (arr, alpha, t, scaleSp) {
  if (alpha < 0.02) return;
  for (var i = 0; i < arr.length; i++) {
    var c = arr[i];
    var x = (c.x + t * c.sp * scaleSp) % (W + 400) - 200;
    cx.fillStyle = 'rgba(255,238,218,' + (alpha*0.4).toFixed(3) + ')';
    for (var p = 0; p < c.puffs.length; p++) {
      var pf = c.puffs[p];
      cx.beginPath();
      cx.ellipse(x + pf.dx*c.sc, c.y + pf.dy*c.sc, pf.rx*c.sc, pf.ry*c.sc, 0, 0, 6.283);
      cx.fill();
    }
  }
}
function drawCity (v, t) {
  if (v.city < 0.02) return;
  for (var i = 0; i < buildings.length; i++) {
    var b = buildings[i];
    cx.fillStyle = 'rgba(8,10,30,' + (v.city*0.92).toFixed(3) + ')';
    cx.fillRect(b.x, HOR - b.h, b.w, b.h + 8);
    for (var j = 0; j < b.win.length; j++) {
      var w2 = b.win[j];
      var tw = 0.5 + 0.5*Math.sin(t*1.5 + w2.ph);
      cx.fillStyle = 'rgba(255,200,120,' + (v.city*(0.30 + 0.45*tw)).toFixed(3) + ')';
      cx.fillRect(b.x + w2.dx, HOR - b.h + w2.dy, 4, 6);
    }
  }
}
function drawParticles (dt) {
  cx.save(); cx.globalCompositeOperation = 'lighter';
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= p.dec*dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    cx.fillStyle = 'rgba(255,210,140,' + (p.life*0.7).toFixed(3) + ')';
    cx.beginPath(); cx.arc(p.x, p.y, p.r*(0.6+p.life*0.6), 0, 6.283); cx.fill();
  }
  cx.restore();
}
function drawLetterbox (t) {
  cx.fillStyle = '#000';
  cx.fillRect(0, 0, W, TOPBAR);
  cx.fillRect(0, H - BOTBAR, W, BOTBAR);

  /* 顶栏信息 */
  cx.textBaseline = 'middle';
  cx.font = '15px ' + KAI;
  cx.fillStyle = 'rgba(255,235,210,0.62)';
  cx.textAlign = 'left';
  cx.fillText('日不落 · 致敬视觉MV', 20, TOPBAR*0.42);
  cx.textAlign = 'right';
  cx.fillText(fmt(t) + ' / ' + fmt(DUR), W - 20, TOPBAR*0.42);
  cx.textAlign = 'center';
  var s = secName(Math.min(t, DUR - 0.01));
  cx.font = '600 15px ' + KAI;
  cx.fillStyle = 'rgba(255,214,140,0.85)';
  cx.fillText(SEC_CN[s], W*0.5, TOPBAR*0.42);

  /* 顶栏进度线（含段落刻度 + 歌词点） */
  var py = TOPBAR - 6;
  cx.fillStyle = 'rgba(255,255,255,0.12)';
  cx.fillRect(20, py, W - 40, 2);
  for (var i = 0; i < SECS.length; i++) {
    var fx = 20 + (W-40) * SECS[i].t0 / DUR;
    cx.fillStyle = 'rgba(255,255,255,0.28)';
    cx.fillRect(fx, py - 4, 1, 10);
  }
  for (var li = 0; li < LINES.length; li++) {
    var lx = 20 + (W-40) * LINES[li].t / DUR;
    cx.fillStyle = 'rgba(255,205,120,0.55)';
    cx.beginPath(); cx.arc(lx, py + 1, 2.4, 0, 6.283); cx.fill();
  }
  if (t > 0 && t <= DUR) {
    var px = 20 + (W-40) * t / DUR;
    cx.fillStyle = '#ffd27a';
    cx.fillRect(px - 1, py - 5, 2, 12);
    cx.shadowColor = '#ffb14a'; cx.shadowBlur = 8;
    cx.fillRect(px - 1, py - 5, 2, 12);
    cx.shadowBlur = 0;
  }

  /* 底栏：操作提示 + 版权说明 */
  cx.font = '13px ' + KAI;
  cx.fillStyle = 'rgba(255,240,220,0.35)';
  cx.textAlign = 'left';
  cx.fillText('空格 播放/暂停 · R 重播', 20, H - BOTBAR*0.30);
  cx.textAlign = 'right';
  cx.fillStyle = 'rgba(255,240,220,0.30)';
  cx.fillText('致敬改编版：旋律与歌词均为原创致敬，非原曲', W - 20, H - BOTBAR*0.30);
}
function currentLine (t) {
  for (var i = 0; i < LINES.length; i++) {
    var ln = LINES[i];
    if (t >= ln.t && t < ln.t + ln.span) return ln;
  }
  return null;
}
function drawLyrics (t) {
  var ln = currentLine(t);
  if (!ln) return;
  var lt = (t - ln.t) / ln.span;
  var alpha = Math.min(1, lt*9, (1 - lt)*9);
  if (alpha <= 0) return;
  var activeF = (t - ln.t) / BEAT;   /* 每字一拍 */
  var chars = ln.text.split('');
  cx.font = '700 38px ' + KAI;
  cx.textBaseline = 'middle'; cx.textAlign = 'left';
  var widths = chars.map(function (c) { return cx.measureText(c).width; });
  var total = widths.reduce(function (a, b) { return a + b; }, 0);
  var gap = 6;
  total += gap * (chars.length - 1);
  var x = (W - total) / 2, y = H - BOTBAR*0.52;
  var activeInt = Math.floor(activeF);
  for (var k = 0; k < chars.length; k++) {
    var cw = widths[k];
    var isSung = k < activeF;
    var isActive = (k === activeInt);
    cx.save();
    cx.globalAlpha = alpha;
    if (isActive) {
      cx.translate(x + cw/2, y);
      var sc = 1 + 0.14 * Math.max(0, 1 - (activeF - activeInt));
      cx.scale(sc, sc);
      cx.translate(-(x + cw/2), -y);
    }
    if (isSung) {
      cx.shadowColor = '#ff9c3c'; cx.shadowBlur = 16;
      cx.fillStyle = '#ffd76a';
    } else {
      cx.shadowBlur = 0;
      cx.fillStyle = 'rgba(255,255,255,0.38)';
    }
    cx.fillText(chars[k], x, y);
    cx.restore();
    x += cw + gap;
  }
  cx.shadowBlur = 0;
}
function drawTitleCard (t) {
  var a = 0;
  if (t >= 0.4 && t < 5.2) a = 1;
  else if (t >= 5.2 && t < 6.4) a = 1 - (t - 5.2) / 1.2;
  if (a <= 0) return;
  cx.save(); cx.globalAlpha = a;
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.shadowColor = 'rgba(255,170,70,0.9)'; cx.shadowBlur = 42;
  cx.font = '700 92px ' + KAI;
  cx.fillStyle = '#ffd98c';
  cx.fillText('日不落', W*0.5, H*0.34);
  cx.shadowBlur = 0;
  cx.font = '400 26px ' + KAI;
  cx.fillStyle = 'rgba(255,240,220,0.85)';
  cx.fillText('蔡依林 · 视觉 MV（致敬）', W*0.5, H*0.34 + 78);
  cx.font = '400 16px ' + KAI;
  cx.fillStyle = 'rgba(255,235,210,0.55)';
  cx.fillText('旋律与歌词为原创致敬改编 · 歌词逐拍对齐演示', W*0.5, H*0.34 + 112);
  cx.restore();
}
function drawOutroCard (t) {
  if (t < 93) return;
  var a = Math.min(1, (t - 93) / 1.6);
  cx.save(); cx.globalAlpha = a;
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.shadowColor = 'rgba(255,170,70,0.9)'; cx.shadowBlur = 36;
  cx.font = '700 64px ' + KAI;
  cx.fillStyle = '#ffd98c';
  cx.fillText('—— 日 不 落 ——', W*0.5, H*0.36);
  cx.shadowBlur = 0;
  cx.font = '400 24px ' + KAI;
  cx.fillStyle = 'rgba(255,240,220,0.85)';
  cx.fillText('太阳，不落下', W*0.5, H*0.36 + 66);
  cx.font = '400 15px ' + KAI;
  cx.fillStyle = 'rgba(255,235,210,0.5)';
  cx.fillText('原创致敬编曲与歌词 · 仅供学习演示', W*0.5, H*0.36 + 100);
  cx.restore();
}
function drawStateOverlays (t) {
  /* 暂停遮罩 */
  if (started && !playing && !ended) {
    cx.fillStyle = 'rgba(0,0,0,0.45)';
    cx.fillRect(0, TOPBAR, W, H - TOPBAR - BOTBAR);
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.font = '700 40px ' + KAI;
    cx.fillStyle = 'rgba(255,225,170,0.9)';
    cx.shadowColor = 'rgba(255,170,70,0.8)'; cx.shadowBlur = 24;
    cx.fillText('暂 停', W*0.5, H*0.45);
    cx.shadowBlur = 0;
  }
  /* 暗角 */
  var vg = cx.createRadialGradient(W/2, H/2, H*0.42, W/2, H/2, H*0.85);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.32)');
  cx.fillStyle = vg;
  cx.fillRect(0, 0, W, H);
}

/* ---------- 主渲染循环 ---------- */
var lastTs = 0;
function render (ts) {
  var dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  var t = songT();
  var tt = Math.max(0, Math.min(DUR, t));

  var beat = tt / BEAT;
  var lastB = Math.floor(beat);
  var frac = (beat - lastB) * BEAT;
  var pulse = started && playing ? Math.max(0, 1 - frac/0.3) : 0;

  /* 节拍触发粒子 */
  if (started && playing && lastB !== lastBeatIdx) {
    lastBeatIdx = lastB;
    var s = secName(tt);
    if (s === 'chorus1' || s === 'chorus2' || s === 'pre1' || s === 'pre2') spawnParticles(8);
  }

  var v = getVis(tt);
  cx.clearRect(0, 0, W, H);
  drawSky(v);
  drawStars(v, tt);
  var sun = drawSun(v, tt, pulse);
  drawSea(v, tt, sun);
  drawCloudLayer(cloudsBack, v.cloud, tt, 1);
  drawCloudLayer(cloudsFront, v.cloud*0.8, tt, 1.6);
  drawCity(v, tt);
  drawParticles(dt);
  drawLetterbox(tt);
  drawLyrics(tt);
  drawTitleCard(tt);
  drawOutroCard(tt);
  drawStateOverlays(tt);

  /* 曲终 */
  if (started && !ended && t > DUR + 0.6) {
    ended = true; playing = false;
    updateUI();
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

/* ---------- UI ---------- */
function updateUI () {
  if (ended) {
    overlay.style.display = 'flex';
    document.getElementById('playBtn').innerHTML = '&#8635;';
    document.getElementById('hint').innerHTML = '播放结束<br>点击重新播放';
  } else if (!started) {
    overlay.style.display = 'flex';
    document.getElementById('playBtn').innerHTML = '&#9654;';
    document.getElementById('hint').innerHTML = '《日不落》致敬视觉MV<br>点击播放 · 歌词与旋律逐拍对齐 · 空格暂停 / R 重播';
  } else {
    overlay.style.display = 'none';
    btns.style.display = 'flex';
    bPlay.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
  }
}
overlay.addEventListener('click', function () { togglePlay(); });
cv.addEventListener('click', function () { togglePlay(); });
bPlay.addEventListener('click', function (e) { e.stopPropagation(); togglePlay(); });
document.getElementById('bRe').addEventListener('click', function (e) { e.stopPropagation(); restart(); });
window.addEventListener('keydown', function (e) {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') { restart(); }
});
updateUI();
</script>
